# ===========================================================================
# Example HPC cluster configuration — copy to <sitename>.conf and edit.
# ===========================================================================
#
# This file is read by scripts/hpc/{upload,status,download}.sh. The
# variables below are what changes between clusters (ssh alias, scratch
# path, partition name, module name, walltime). The workflow code itself
# does NOT need to know about your cluster — only this file does.
#
# Workshop pattern: copy this file to <your_cluster>.conf, edit, and
# pass it explicitly:
#
#   bash scripts/hpc/upload.sh   scripts/hpc/csf3.conf
#   bash scripts/hpc/status.sh   scripts/hpc/csf3.conf
#   bash scripts/hpc/download.sh scripts/hpc/csf3.conf
#
# If invoked without an argument, the scripts fall back to
# ./scripts/hpc/hpc.conf.

# --- SSH connection ------------------------------------------------------
HPC_HOST="csf3"                  # SSH alias from ~/.ssh/config, OR full hostname
HPC_USER="your_user"             # Username on the cluster

# --- Filesystem ---------------------------------------------------------
HPC_SCRATCH="~/scratch"          # Per-user scratch / work directory on the cluster
# Remote case dir will be:  $HPC_SCRATCH/$PATIENT_ID/$RUN_NAME/

# --- SLURM scheduler ----------------------------------------------------
HPC_PARTITION="multicore"        # SLURM partition name (cluster-specific)
HPC_NCORES=32                    # Cores requested per task (passes to OpenFOAM decomposition)
HPC_WALLTIME="2-0"               # Wall-clock limit (D-HH:MM:SS or HH:MM:SS)
# HPC_QOS="normal"                # Optional QoS, if your site uses it
# HPC_ACCOUNT="myproject"         # Optional accounting group, if required

# --- OpenFOAM module ----------------------------------------------------
# This is the line `module load ...` will be inserted into the job script.
# Look up the exact name on your cluster: `module avail openfoam` (or ask
# your cluster docs / HPC support).
HPC_OF_MODULE="apps/gcc/openfoam/12"

# Solver invocation. For OpenFOAM 12 Foundation (this project's target):
HPC_SOLVER="foamRun"
HPC_SOLVER_ARGS="-solver incompressibleFluid"
# For older OpenFOAM 5.x / 6.x ESI variants:
# HPC_SOLVER="pimpleFoam"
# HPC_SOLVER_ARGS=""

# --- Local-side identifiers ---------------------------------------------
# Used by upload.sh / status.sh / download.sh to construct paths.
PATIENT_ID="VOL04"
RUN_NAME="laminar_baseline"
LOCAL_CASE_DIR="output/${PATIENT_ID}/${RUN_NAME}/openfoam"

# ---------------------------------------------------------------------------
# Workshop checklist before you submit your first job:
#   [ ] HPC_HOST resolves: ssh $HPC_HOST exit
#   [ ] HPC_SCRATCH exists and has write permission
#   [ ] `module avail $HPC_OF_MODULE` shows the module on the cluster
#   [ ] HPC_PARTITION is one your account can submit to: `sinfo`
#   [ ] HPC_NCORES <= the partition's max cores per node
#   [ ] HPC_WALLTIME is within the partition's max walltime: `sinfo -o "%P %l"`
# ---------------------------------------------------------------------------
