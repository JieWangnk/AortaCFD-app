[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aortacfd"
version = "1.4.0"
description = "Automated framework for patient-specific aortic hemodynamics simulations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AortaCFD Development Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = [
    "CFD",
    "computational fluid dynamics",
    "cardiovascular",
    "aorta",
    "hemodynamics",
    "OpenFOAM",
    "patient-specific",
    "simulation"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "jinja2>=3.1.0",
    "numpy-stl>=3.0.0",
    "scikit-learn>=1.0.0",
    "vtk>=9.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
# Optional: advanced STL ops (only used in a few mesh-quality paths)
mesh = [
    "trimesh>=3.15.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "pytest-html>=3.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
]

[project.scripts]
aortacfd = "patient_runner.cli:main"

[project.urls]
"Homepage" = "https://github.com/AortaCFD/AortaCFD-app"
"Documentation" = "https://github.com/AortaCFD/AortaCFD-app#readme"
"Bug Tracker" = "https://github.com/AortaCFD/AortaCFD-app/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.tpl", "*.json", "*.yaml"]

# =============================================================================
# PYTEST CONFIGURATION
# =============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests requiring OpenFOAM",
    "benchmark: validates simulation outputs against published reference values (requires BPM120_QOI env var)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# =============================================================================
# COVERAGE CONFIGURATION
# =============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]
parallel = true

[tool.coverage.paths]
source = [
    "src/",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
fail_under = 60
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.html]
directory = "htmlcov"
title = "AortaCFD Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

# =============================================================================
# BLACK CONFIGURATION
# =============================================================================
[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | output
)/
'''

# =============================================================================
# ISORT CONFIGURATION
# =============================================================================
[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["aortacfd_lib", "config", "workflow", "patient_runner"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# =============================================================================
# MYPY CONFIGURATION
# =============================================================================
[tool.mypy]
python_version = "3.10"
# warn_return_any disabled: numpy/scipy/pandas extensively return Any,
# producing high-noise warnings without real signal. Will be re-enabled
# in v1.2.0 once a focused typing pass lands (planned milestone).
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
# Codes that fire predominantly on legitimate numpy/scipy return-types
# or on intentional Optional handling. Tracked for v1.2.0.
disable_error_code = ["no-any-return", "assignment", "attr-defined"]
exclude = [
    "venv",
    ".venv",
    "tests",
    "output",
]

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "scipy.*",
    "pandas.*",
    "matplotlib.*",
    "jinja2.*",
    "stl.*",
]
ignore_missing_imports = true

# =============================================================================
# FLAKE8 CONFIGURATION (for reference - flake8 uses .flake8 or setup.cfg)
# =============================================================================
# Note: flake8 doesn't support pyproject.toml natively.
# Configuration is in .github/workflows/tests.yml command line options.
