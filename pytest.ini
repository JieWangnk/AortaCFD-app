[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = 
    --verbose
    --tb=short
    --cov=src/aortacfd_lib
    --cov=src/config
    --cov=src/workflow
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --html=tests/reports/report.html
    --self-contained-html
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_openfoam: Tests that require OpenFOAM installation
    requires_paraview: Tests that require ParaView installation
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning