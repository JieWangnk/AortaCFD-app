name: Run a requested case

# A visitor files a "Request a CFD run" issue (labelled run-request by the form).
# Nothing happens until a maintainer adds the label "approved". That label starts
# this workflow on the self-hosted runner (the laptop that has AortaCFD-app,
# OpenFOAM 12 and the site checkout), which runs the case with the default
# request configuration, publishes the case page to AortaCFD-web with the
# SITE_TOKEN secret, and reports back on the issue. One request at a time.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: run-request
  cancel-in-progress: false

jobs:
  run:
    if: github.event.label.name == 'approved' && contains(join(github.event.issue.labels.*.name, ','), 'run-request')
    runs-on: [self-hosted, aortacfd-laptop]
    timeout-minutes: 480
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - name: Say the run has started
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: 'Approved. The run starts now on a four-core laptop. This issue gets a comment with the link when the case page is live, or with the end of the log if the run fails.'
            });

      - name: Check out the site
        uses: actions/checkout@v4
        with:
          repository: JieWangnk/AortaCFD-web
          token: ${{ secrets.SITE_TOKEN }}
          path: site
          ref: main

      - name: Run the case and publish it
        run: |
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/request_body.md"
          git -C site config user.name "OpenCardioFlow runner"
          git -C site config user.email "opencardioflow-runner@users.noreply.github.com"
          "$HOME/GitHub/.venv/bin/python3" site/scripts/run_request.py \
            --issue "$ISSUE_NUMBER" --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/request_body.md" \
            --app "$HOME/GitHub/AortaCFD-app" --site site --result "$RUNNER_TEMP/request_result.json"

      - name: Push the case page (deploys the site)
        if: success()
        run: git -C site push origin HEAD:main

      - name: Report on the issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/request_result.json', 'utf8'));
              if (r.status === 'published') {
                body = `Done in about ${r.minutes} minutes. The case page is ${r.page} (live a few minutes after this comment).`;
                if (r.flags && r.flags.length) body += '\n\nFlags raised by the pipeline, to read before quoting a number:\n' + r.flags.map(f => '- ' + f).join('\n');
              } else {
                body = `The run did not finish: ${r.error}\n\nEnd of the log:\n\`\`\`\n${r.log_tail || '(no log)'}\n\`\`\``;
              }
            } catch (e) {
              body = 'The run step failed before it could write a result; see the workflow log.';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body
            });
