# AortaCFD Release Workflow
# Triggered when a new version tag is pushed (e.g., v2.0, v2.1.0)

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Run Tests Before Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests with coverage gate
      run: |
        PYTHONPATH=src pytest tests/ -v --cov=src --cov-report=xml \
          --cov-fail-under=60 -m "not slow and not e2e"

    - name: Lint gate (block F-code violations)
      run: |
        flake8 src/ --select F --max-line-length 120 --extend-ignore E203,W503

    - name: Security gate (block bandit HIGH/HIGH)
      run: |
        bandit -r src/ -ll -ii

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: release

  # Note: Documentation is built and deployed from AortaCFD-web repository
  # See: https://github.com/JieWangnk/AortaCFD-web

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

        if [ -z "$PREV_TAG" ]; then
          # First release - get all commits
          CHANGELOG=$(git log --oneline --pretty=format:"- %s" | head -50)
        else
          # Get commits since previous tag
          CHANGELOG=$(git log ${PREV_TAG}..HEAD --oneline --pretty=format:"- %s")
        fi

        # Write to file for multiline output
        echo "$CHANGELOG" > changelog.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: AortaCFD ${{ steps.get_version.outputs.VERSION }}
        body_path: changelog.txt
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
