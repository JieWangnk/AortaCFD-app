name: Tests

on:
  push:
    branches: [ main, develop, patientStructure ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist

    - name: Run all tests with coverage
      run: |
        PYTHONPATH=src pytest tests/ \
          --cov=src \
          --cov-report=xml \
          --cov-report=term-missing \
          --cov-report=html \
          --cov-fail-under=50 \
          --tb=short \
          -v \
          --maxfail=10

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      if: matrix.python-version == '3.12'
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 14

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Display test summary
      if: always()
      run: |
        echo "========================================="
        echo "Test Summary for Python ${{ matrix.python-version }}"
        echo "========================================="
        PYTHONPATH=src pytest tests/ --co -q 2>/dev/null | tail -5 || echo "Test collection completed"

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Check code formatting with black
      run: |
        black --check src/ tests/ --line-length 120 || echo "::warning::Code formatting issues found. Run 'black src/ tests/ --line-length 120' to fix."
      continue-on-error: true

    - name: Check import sorting with isort
      run: |
        isort --check-only src/ tests/ --profile black || echo "::warning::Import sorting issues found. Run 'isort src/ tests/ --profile black' to fix."
      continue-on-error: true

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Warnings for complexity and style (non-blocking)
        flake8 src/ tests/ --count --max-complexity=15 --max-line-length=120 --statistics || echo "::warning::Flake8 style warnings found."
      continue-on-error: true

  test-summary:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()

    steps:
    - name: Summary
      run: |
        echo "========================================="
        echo "CI/CD Pipeline Summary"
        echo "========================================="
        echo "✅ Tests completed across Python 3.10, 3.11, 3.12"
        echo "✅ Code linting and formatting checks completed"
        echo "========================================="
