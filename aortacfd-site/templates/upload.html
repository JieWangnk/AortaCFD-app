{% extends 'base.html' %}
{% block title %}Upload File to CAD{% endblock %}
{% block content %}
<h2>Upload File to CAD Folder</h2>
<form method="post" enctype="multipart/form-data">
  <div class="mb-3">
    <label for="case_folder" class="form-label">Case Folder Name:</label>
    <input type="text" name="case_folder" id="case_folder" class="form-control" required>
  </div>
  <div class="mb-3">
    <label for="file" class="form-label">Select Files:</label>
    <input type="file" name="file" id="file" class="form-control" required multiple>
  </div>
  <button type="submit" class="btn btn-primary">Upload</button>
</form>
{% if message %}
  <div class="alert alert-info mt-3">{{ message }}</div>
{% endif %}
{% endblock %}
