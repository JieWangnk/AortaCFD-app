{% extends 'base.html' %}
{% block title %}Run AortaCFD Simulation{% endblock %}
{% block content %}
<h2>Run AortaCFD Simulation</h2>
<form method="post" class="mb-3">
  <div class="row">
    <div class="col-md-4 mb-3">
      <label for="case" class="form-label">Case Name:</label>
      <input type="text" name="case" id="case" class="form-control" required>
    </div>
    <div class="col-md-4 mb-3">
      <label for="profile" class="form-label">Profile Name:</label>
      <input type="text" name="profile" id="profile" class="form-control" required>
    </div>
  </div>
  <button type="submit" class="btn btn-danger">Run Simulation</button>
</form>
{% if sim_output %}
  <div class="alert alert-info mt-3" style="white-space: pre-wrap;">
    <strong>Simulation Output:</strong><br>
    {{ sim_output }}
  </div>
{% endif %}
{% if sim_error %}
  <div class="alert alert-danger mt-3" style="white-space: pre-wrap;">
    <strong>Error:</strong><br>
    {{ sim_error }}
  </div>
{% endif %}
{% endblock %}
